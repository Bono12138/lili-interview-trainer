name: Notify Drive Bridge

on:
  push:
    paths-ignore:
      - '.github/workflows/sync-to-drive.yml'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger github-drive-bridge
        env:
          GH_TOKEN: ${{ secrets.BRIDGE_DISPATCH_TOKEN }}
        run: |
          gh api repos/Bono12138/github-drive-bridge/dispatches \
            -f event_type=sync-repo \
            -f "client_payload[repo]=${{ github.event.repository.name }}"
